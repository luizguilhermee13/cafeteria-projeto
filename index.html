<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="frontend/aplicativo/assets/css/styles.css" />
    <link rel="stylesheet" href="frontend/aplicativo/assets/css/login.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=local_cafe"
    />
    <title>Cafeteria Gourmet!</title>
  </head>
  <body>
    <div class="container">
      <form id="loginForm" class="card_login">
        <div class="card_header">
          <div class="icon">
            <span class="material-symbols-outlined"> local_cafe </span>
          </div>
          <div class="title"><h4>Café Gourmet</h4></div>
          <div class="text"><p>Entre na sua conta</p></div>
        </div>

        <div class="card_main">
          <label for="email">Email</label>
          <input
            type="text"
            name="email"
            id="email"
            placeholder="adm"
            autocomplete="username"
            required
          />

          <label for="senha">Senha</label>
          <input
            type="password"
            name="senha"
            id="senha"
            placeholder="123"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="card_footer">
          <button type="submit">Entrar</button>
          <p>Não tem uma conta? Cadastre-se</p>
        </div>
      </form>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
